apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/Solierrr/infra-gitops.git
      targetRevision: main
      path: services/grafana
    # dashboards e provider: um único dono, o repositório de observabilidade
    - repoURL: https://github.com/Solierrr/infra-otel-collector.git
      targetRevision: main
      path: grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
