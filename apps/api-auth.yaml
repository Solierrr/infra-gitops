apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-auth
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Solierrr/infra-gitops.git
    targetRevision: main
    path: services/api-auth
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
