apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-accessibility
  labels:
    app: ai-accessibility
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-accessibility
  template:
    metadata:
      labels:
        app: ai-accessibility
    spec:
      containers:
        - name: ai-accessibility
          image: docker.io/solarianetwork/ai-accessibility:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: ai-accessibility-secrets
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: https://solarianetwork.site
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
