apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-core
  labels:
    app: api-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-core
  template:
    metadata:
      labels:
        app: api-core
    spec:
      containers:
        - name: api-core
          image: docker.io/solarianetwork/api-core:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: api-core-secrets
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: https://solarianetwork.site
            # O Postgres da Aiven tem poucas conexoes; o pool padrao do Hikari (10) estoura o limite
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "4"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            - name: JWT_JWK_SET_URI
              value: http://api-auth:8081/.well-known/jwks.json
            - name: API_EMAIL_URL
              value: http://api-email:8083
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
