apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-notify
spec:
  ingressClassName: kong
  rules:
    - host: api-notify.solarianetwork.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-notify
                port:
                  number: 8080
