apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-messenger
  labels:
    app: api-messenger
spec:
  # 0 until required secrets (SERVICE_JWT_SECRET) are wired up - it
  # crash-loops otherwise, just reserving node capacity for nothing.
  replicas: 0
  selector:
    matchLabels:
      app: api-messenger
  template:
    metadata:
      labels:
        app: api-messenger
    spec:
      containers:
        - name: api-messenger
          image: docker.io/solarianetwork/api-messenger:b9adacb
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
