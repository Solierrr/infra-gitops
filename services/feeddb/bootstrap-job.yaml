apiVersion: batch/v1
kind: Job
metadata:
  name: database-bootstrap
  labels:
    app: database-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: database-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: database-bootstrap
          image: docker.io/solarianetwork/database-bootstrap:8d181e40f42ea197e4d2cdef130733632e683546
          envFrom:
            - secretRef:
                name: database-bootstrap-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
