apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-bootstrap
  labels:
    app: database-bootstrap
spec:
  schedule: "0 6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: database-bootstrap
        spec:
          restartPolicy: Never
          containers:
            - name: database-bootstrap
              image: docker.io/solarianetwork/database-bootstrap:eb3e9c4264545ed94f6b10ba53b8779306db9fc4
              envFrom:
                - secretRef:
                    name: database-bootstrap-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
