apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-grafana-datasources
  labels:
    app: infra-grafana
data:
  # As fontes de dados são as do Grafana Cloud, onde o coletor entrega a telemetria.
  # URL, usuário e token vêm do Secret infra-grafana-secrets (variáveis de ambiente),
  # então nada sensível fica neste arquivo.
  datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: ${GRAFANA_CLOUD_PROMETHEUS_URL}
        basicAuth: true
        basicAuthUser: ${GRAFANA_CLOUD_PROMETHEUS_USER}
        secureJsonData:
          basicAuthPassword: ${GRAFANA_CLOUD_READ_TOKEN}
        isDefault: true
        editable: false
      - name: loki
        uid: loki
        type: loki
        access: proxy
        url: ${GRAFANA_CLOUD_LOKI_URL}
        basicAuth: true
        basicAuthUser: ${GRAFANA_CLOUD_LOKI_USER}
        secureJsonData:
          basicAuthPassword: ${GRAFANA_CLOUD_READ_TOKEN}
        editable: false
      - name: tempo
        uid: tempo
        type: tempo
        access: proxy
        url: ${GRAFANA_CLOUD_TEMPO_URL}
        basicAuth: true
        basicAuthUser: ${GRAFANA_CLOUD_TEMPO_USER}
        secureJsonData:
          basicAuthPassword: ${GRAFANA_CLOUD_READ_TOKEN}
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
