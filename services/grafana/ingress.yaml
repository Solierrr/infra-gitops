apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-grafana
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: kong
  tls:
    - hosts:
        - grafana.solarianetwork.site
      secretName: infra-grafana-tls
  rules:
    - host: grafana.solarianetwork.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-grafana
                port:
                  number: 3000
