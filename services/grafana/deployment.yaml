apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-grafana
  labels:
    app: infra-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: infra-grafana
  template:
    metadata:
      labels:
        app: infra-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: infra-grafana
          image: docker.io/grafana/grafana:13.2.5
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: infra-grafana-secrets
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.solarianetwork.site
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Login único: o Cloudflare Access manda o token de quem já passou pelo
            # login do Google em Cf-Access-Jwt-Assertion e o Grafana o valida pelas
            # chaves públicas do Access. Só os e-mails autorizados chegam até aqui.
            - name: GF_AUTH_JWT_ENABLED
              value: "true"
            - name: GF_AUTH_JWT_HEADER_NAME
              value: Cf-Access-Jwt-Assertion
            - name: GF_AUTH_JWT_EMAIL_CLAIM
              value: email
            - name: GF_AUTH_JWT_USERNAME_CLAIM
              value: email
            - name: GF_AUTH_JWT_JWK_SET_URL
              value: https://long-hat-66b3.cloudflareaccess.com/cdn-cgi/access/certs
            - name: GF_AUTH_JWT_CACHE_TTL
              value: 60m
            - name: GF_AUTH_JWT_EXPECT_CLAIMS
              value: '{"iss":"https://long-hat-66b3.cloudflareaccess.com"}'
            - name: GF_AUTH_JWT_AUTO_SIGN_UP
              value: "true"
            # GF_AUTH_JWT_ROLE_ATTRIBUTE_PATH (papel Admin ou Viewer por e-mail) vem do
            # Secret infra-grafana-secrets, para a lista de e-mails não ir a este repositório público
            - name: GF_AUTH_JWT_ALLOW_ASSIGN_GRAFANA_ADMIN
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/dashboards
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: infra-grafana-data
        - name: datasources
          configMap:
            name: infra-grafana-datasources
        # os dois ConfigMaps abaixo vêm do repositório infra-otel-collector (diretório grafana)
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
