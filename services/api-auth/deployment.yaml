apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-auth
  labels:
    app: api-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-auth
  template:
    metadata:
      labels:
        app: api-auth
    spec:
      containers:
        - name: api-auth
          image: docker.io/solarianetwork/api-auth:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: api-auth-secrets
          env:
            # O Postgres da Aiven tem poucas conexoes; o pool padrao do Hikari (10) estoura o limite
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "4"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            # api-auth lê essa URL via PERSISTENCE_BASE_URL
            # (app.integration.persistence.base-url), não CORE_BASE_URL - o
            # nome errado aqui fazia cair no default localhost:8080 dentro
            # do pod, quebrando a chamada api-auth -> api-core em prod.
            - name: PERSISTENCE_BASE_URL
              value: http://api-core:8080
            # O Upstash só aceita conexão com TLS; a URL do Redis é redis:// e o
            # serviço falhava ao iniciar com "Connection closed prematurely".
            - name: SPRING_DATA_REDIS_SSL_ENABLED
              value: "true"
            - name: JWT_KEYSTORE_PATH
              value: /etc/secrets/jwt/keystore.p12
          volumeMounts:
            # O entrypoint decodifica JWT_KEYSTORE_BASE64 para JWT_KEYSTORE_PATH, entao o
            # diretorio precisa ser gravavel (um volume de Secret e somente leitura).
            - name: jwt-keystore
              mountPath: /etc/secrets/jwt
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: jwt-keystore
          emptyDir: {}
