apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-grafana-dashboards
  labels:
    app: infra-grafana
data:
  solaria.yaml: |
    apiVersion: 1

    providers:
      - name: Solaria
        type: file
        options:
          path: /var/lib/solaria/dashboards
          foldersFromFilesStructure: false
  overview.json: |
    {
      "uid": "solaria-overview",
      "title": "Solaria / Visão geral",
      "description": "Taxa de requisições, erros 5xx, latência p95 e erros nos logs de cada serviço.",
      "tags": [
        "solaria"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Serviço",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values({__name__=~\"http_server_requests_milliseconds_count|http_server_duration_milliseconds_count\"}, service_name)",
              "refId": "v"
            },
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requisições por segundo",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service_name) (rate({__name__=~\"http_server_requests_milliseconds_count|http_server_duration_milliseconds_count\", service_name=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Erros 5xx por segundo",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service_name) (rate({__name__=\"http_server_requests_milliseconds_count\", status=~\"5..\", service_name=~\"$service\"}[$__rate_interval])) or sum by (service_name) (rate({__name__=\"http_server_duration_milliseconds_count\", http_status_code=~\"5..\", service_name=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latência p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate({__name__=~\"http_server_requests_milliseconds_bucket|http_server_duration_milliseconds_bucket\", service_name=~\"$service\"}[$__rate_interval])))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Logs de erro por minuto",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (service_name) (count_over_time({service_name=~\"$service\"} | detected_level=~\"error|ERROR\" [1m]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        }
      ],
      "annotations": {
        "list": []
      },
      "links": []
    }
  service.json: |
    {
      "uid": "solaria-service",
      "title": "Solaria / Serviço",
      "description": "Métricas, logs e traces de um serviço. Clique em um trace ou em um log com trace_id para navegar entre eles.",
      "tags": [
        "solaria"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Serviço",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values({__name__=~\"http_server_requests_milliseconds_count|http_server_duration_milliseconds_count\"}, service_name)",
              "refId": "v"
            },
            "refresh": 2,
            "includeAll": false,
            "multi": false,
            "allValue": ".+",
            "current": {},
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requisições por segundo",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service_name) (rate({__name__=~\"http_server_requests_milliseconds_count|http_server_duration_milliseconds_count\", service_name=\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Erros 5xx por segundo",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service_name) (rate({__name__=\"http_server_requests_milliseconds_count\", status=~\"5..\", service_name=\"$service\"}[$__rate_interval])) or sum by (service_name) (rate({__name__=\"http_server_duration_milliseconds_count\", http_status_code=~\"5..\", service_name=\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latência p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate({__name__=~\"http_server_requests_milliseconds_bucket|http_server_duration_milliseconds_bucket\", service_name=\"$service\"}[$__rate_interval])))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "logs",
          "title": "Logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 9
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{service_name=\"$service\"}"
            }
          ]
        },
        {
          "id": 6,
          "type": "table",
          "title": "Traces recentes",
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceqlSearch",
              "filters": [
                {
                  "id": "service-name",
                  "tag": "service.name",
                  "operator": "=",
                  "scope": "resource",
                  "value": [
                    "$service"
                  ],
                  "valueType": "string"
                }
              ],
              "limit": 20,
              "tableType": "traces"
            }
          ]
        }
      ],
      "annotations": {
        "list": []
      },
      "links": []
    }
