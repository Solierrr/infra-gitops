apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-grafana
  labels:
    app: infra-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: infra-grafana
  template:
    metadata:
      labels:
        app: infra-grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: infra-grafana
          image: docker.io/grafana/grafana:13.2.5
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: infra-grafana-secrets
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.solarianetwork.site
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards/solaria.yaml
              subPath: solaria.yaml
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/solaria/dashboards/overview.json
              subPath: overview.json
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/solaria/dashboards/service.json
              subPath: service.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: infra-grafana-data
        - name: datasources
          configMap:
            name: infra-grafana-datasources
        - name: dashboards
          configMap:
            name: infra-grafana-dashboards
