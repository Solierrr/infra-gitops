apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-broker
  labels:
    app: infra-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: infra-broker
  template:
    metadata:
      labels:
        app: infra-broker
    spec:
      containers:
        - name: infra-broker
          image: docker.io/solarianetwork/infra-broker:0.3.0
          ports:
            - name: stomp
              containerPort: 61613
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          envFrom:
            - secretRef:
                name: infra-broker-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 61613
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
