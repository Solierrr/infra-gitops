apiVersion: v1
kind: Service
metadata:
  name: infra-broker
  labels:
    app: infra-broker
spec:
  type: ClusterIP
  selector:
    app: infra-broker
  ports:
    - name: stomp
      port: 61613
      targetPort: 61613
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
