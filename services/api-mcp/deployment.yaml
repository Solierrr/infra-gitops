apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-mcp
  labels:
    app: api-mcp
spec:
  replicas: 0
  selector:
    matchLabels:
      app: api-mcp
  template:
    metadata:
      labels:
        app: api-mcp
    spec:
      containers:
        - name: api-mcp
          image: docker.io/solarianetwork/api-mcp:latest
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: api-mcp-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
