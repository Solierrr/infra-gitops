apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-operational
  labels:
    app: ai-operational
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-operational
  template:
    metadata:
      labels:
        app: ai-operational
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ai-operational
          image: docker.io/solarianetwork/ai-operational:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-operational-secrets
          env:
            - name: ENVIRONMENT
              value: PROD
            - name: CORS_ALLOWED_ORIGINS
              value: https://solarianetwork.site
            - name: API_CORE_URL
              value: http://api-core:8080/api
            - name: MCP_URL
              value: http://mcp-database:8001/mcp
            - name: A2A_PUBLIC_URL
              value: http://ai-operational:8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
