apiVersion: apps/v1
kind: Deployment
metadata:
  name: google-registry
  labels:
    app: google-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: google-registry
  template:
    metadata:
      labels:
        app: google-registry
    spec:
      automountServiceAccountToken: false
      containers:
        - name: google-registry
          image: docker.io/solarianetwork/google-registry:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: prod
            - name: LOG_LEVEL
              value: INFO
          envFrom:
            - secretRef:
                name: google-registry-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
